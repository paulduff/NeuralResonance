<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NRE Tab Capture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <h1>NRE Tab Capture</h1>

    <label>API Base</label>
    <input id="apiBase" type="text" value="http://localhost:5005/" />

    <div class="grid">
      <div>
        <label>FPS</label>
        <input id="fps" type="number" min="1" max="30" step="1" value="6" />
      </div>
      <div>
        <label>Width</label>
        <input id="width" type="number" min="32" max="256" step="1" value="96" />
      </div>
      <div>
        <label>Height</label>
        <input id="height" type="number" min="32" max="256" step="1" value="96" />
      </div>
    </div>

    <div class="checks">
      <label><input id="enableVisual" type="checkbox" checked /> Visual</label>
      <label><input id="enableAudio" type="checkbox" checked /> Audio</label>
      <label><input id="allowAudioPlayback" type="checkbox" /> Hear Audio</label>
      <label><input id="enableText" type="checkbox" checked /> Text/Captions</label>
    </div>

    <div class="buttons">
      <button id="startBtn" class="ok">Start Capture</button>
      <button id="stopBtn">Stop</button>
    </div>

    <div class="health">
      <div class="health-title">Stream Health</div>
      <div class="health-grid">
        <div id="healthVisual" class="health-badge state-idle">Visual: Idle</div>
        <div id="healthAudio" class="health-badge state-idle">Audio: Idle</div>
        <div id="healthText" class="health-badge state-idle">Text: Idle</div>
        <div id="healthPost" class="health-badge state-idle">Post: Idle</div>
      </div>
    </div>

    <div id="status" class="status">Idle</div>
    <div class="hint">Open the website/tab you want, then click Start Capture.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
