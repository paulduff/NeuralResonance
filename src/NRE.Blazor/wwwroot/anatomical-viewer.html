<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRE - Anatomical Circuit Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        #app {
            display: flex;
            height: 100vh;
        }
        
        #sidebar {
            width: 280px;
            background: #12122a;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #2a2a4a;
        }
        
        #viewer {
            flex: 1;
            position: relative;
        }
        
        h1 {
            font-size: 1.4em;
            color: #80c0ff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #3a3a5a;
        }
        
        h2 {
            font-size: 1em;
            color: #a0a0c0;
            margin: 15px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .circuit-list {
            list-style: none;
        }
        
        .circuit-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin: 4px 0;
            background: #1a1a3a;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .circuit-item:hover {
            background: #2a2a5a;
        }
        
        .circuit-item.active {
            background: #3a3a6a;
            border-left: 3px solid var(--circuit-color, #80c0ff);
        }
        
        .circuit-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            margin-right: 10px;
        }
        
        .circuit-name {
            flex: 1;
            font-size: 0.9em;
        }
        
        .circuit-neurons {
            font-size: 0.75em;
            color: #808090;
        }
        
        .controls {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #3a3a5a;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #2a2a5a;
            border: none;
            border-radius: 6px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }
        
        .btn:hover {
            background: #4a4a7a;
        }
        
        .btn.primary {
            background: #4060a0;
        }
        
        .btn.primary:hover {
            background: #5070b0;
        }
        
        .view-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 40, 0.9);
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 300px;
        }
        
        .info-panel h3 {
            color: #80c0ff;
            margin-bottom: 10px;
        }
        
        .info-panel p {
            font-size: 0.85em;
            line-height: 1.5;
            color: #b0b0c0;
        }
        
        .scale-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 40, 0.9);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.8em;
        }
        
        .scale-info span {
            color: #ffcc00;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2em;
            color: #606080;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h1>🧠 Circuit Viewer</h1>
            <p style="font-size: 0.8em; color: #808090; margin-bottom: 15px;">
                True anatomical shapes at 1:1 biological scale. No distortion.
            </p>
            
            <h2>Subcortical Circuits</h2>
            <ul class="circuit-list" id="subcortical-list"></ul>
            
            <h2>Modulatory Nuclei</h2>
            <ul class="circuit-list" id="modulatory-list"></ul>
            
            <h2>Major Structures</h2>
            <ul class="circuit-list" id="major-list"></ul>
            
            <div class="controls">
                <h2>View</h2>
                <div class="view-buttons">
                    <button class="btn" onclick="setView('sagittal')">Sagittal</button>
                    <button class="btn" onclick="setView('coronal')">Coronal</button>
                    <button class="btn" onclick="setView('axial')">Axial</button>
                    <button class="btn" onclick="setView('oblique')">3D</button>
                </div>
                
                <h2>Display</h2>
                <button class="btn primary" onclick="showAll()">Show All</button>
                <button class="btn" onclick="hideAll()">Hide All</button>
                <button class="btn" onclick="resetView()">Reset Highlight</button>
            </div>
        </div>
        
        <div id="viewer">
            <div id="loading">Loading Three.js...</div>
            
            <div class="info-panel" id="info-panel" style="display: none;">
                <h3 id="info-title">Circuit Info</h3>
                <p id="info-content"></p>
            </div>
            
            <div class="scale-info">
                Scale: <span>1 unit = 1 mm</span> | Grid squares = 10 mm
            </div>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="js/anatomicalCircuitRenderer.js"></script>
    <script>
        // Circuit data with biological info
        const CIRCUITS = {
            subcortical: [
                { id: 'hippocampus', name: 'Hippocampus', color: '#40E070', neurons: '25M', info: 'Memory formation and spatial navigation. Curved seahorse shape in medial temporal lobe.' },
                { id: 'amygdala', name: 'Amygdala', color: '#F04040', neurons: '12M', info: 'Emotion processing, especially fear. Almond-shaped structure anterior to hippocampus.' },
                { id: 'basal_ganglia', name: 'Basal Ganglia', color: '#6060D0', neurons: '816M', info: 'Action selection and motor control. C-shaped striatum wraps around thalamus.' },
                { id: 'thalamus', name: 'Thalamus', color: '#F0C040', neurons: '50M', info: 'Central relay station. Egg-shaped structure with multiple nuclei.' },
                { id: 'hypothalamus', name: 'Hypothalamus', color: '#D08850', neurons: '7M', info: 'Autonomic control, hormones, homeostasis. Small cluster below thalamus.' },
            ],
            modulatory: [
                { id: 'vta', name: 'VTA', color: '#FF8000', neurons: '400K', info: 'Ventral Tegmental Area. Dopamine neurons for reward and motivation.' },
                { id: 'locus_coeruleus', name: 'Locus Coeruleus', color: '#4080FF', neurons: '50K', info: 'Noradrenaline neurons. Tiny but projects throughout brain.' },
            ],
            major: [
                { id: 'cortex', name: 'Cerebral Cortex', color: '#E0E0A0', neurons: '16B', info: 'Folded 2-4mm sheet covering cerebrum. 6 layers, organized into lobes: Frontal, Parietal, Temporal, Occipital.' },
                { id: 'cerebellum', name: 'Cerebellum', color: '#B070E0', neurons: '69B', info: 'Motor coordination. Contains 80% of brain neurons despite 10% volume!' },
                { id: 'brainstem', name: 'Brainstem', color: '#70A0E0', neurons: '1B', info: 'Vital functions. Midbrain, pons, and medulla.' },
            ]
        };
        
        let activeCircuits = new Set();
        
        function init() {
            document.getElementById('loading').style.display = 'none';
            
            // Initialize renderer
            AnatomicalCircuitRenderer.init('viewer');
            
            // Build circuit lists
            buildCircuitList('subcortical-list', CIRCUITS.subcortical);
            buildCircuitList('modulatory-list', CIRCUITS.modulatory);
            buildCircuitList('major-list', CIRCUITS.major);
            
            // Show default circuits
            toggleCircuit('hippocampus');
            toggleCircuit('thalamus');
            toggleCircuit('basal_ganglia');
        }
        
        function buildCircuitList(containerId, circuits) {
            const container = document.getElementById(containerId);
            
            circuits.forEach(circuit => {
                const item = document.createElement('li');
                item.className = 'circuit-item';
                item.id = `item-${circuit.id}`;
                item.style.setProperty('--circuit-color', circuit.color);
                item.innerHTML = `
                    <div class="circuit-color" style="background: ${circuit.color}"></div>
                    <span class="circuit-name">${circuit.name}</span>
                    <span class="circuit-neurons">${circuit.neurons}</span>
                `;
                item.onclick = () => toggleCircuit(circuit.id);
                item.onmouseenter = () => showInfo(circuit);
                item.onmouseleave = () => hideInfo();
                container.appendChild(item);
            });
        }
        
        function toggleCircuit(circuitId) {
            const item = document.getElementById(`item-${circuitId}`);
            
            if (activeCircuits.has(circuitId)) {
                AnatomicalCircuitRenderer.hideCircuit(circuitId);
                activeCircuits.delete(circuitId);
                item.classList.remove('active');
            } else {
                AnatomicalCircuitRenderer.showCircuit(circuitId);
                activeCircuits.add(circuitId);
                item.classList.add('active');
            }
        }
        
        function showInfo(circuit) {
            const panel = document.getElementById('info-panel');
            document.getElementById('info-title').textContent = circuit.name;
            document.getElementById('info-content').textContent = circuit.info;
            panel.style.display = 'block';
            
            // Highlight this circuit
            AnatomicalCircuitRenderer.highlightCircuit(circuit.id);
        }
        
        function hideInfo() {
            document.getElementById('info-panel').style.display = 'none';
            AnatomicalCircuitRenderer.resetHighlight();
        }
        
        function setView(view) {
            AnatomicalCircuitRenderer.setCameraView(view);
        }
        
        function showAll() {
            Object.values(CIRCUITS).flat().forEach(c => {
                if (!activeCircuits.has(c.id)) {
                    toggleCircuit(c.id);
                }
            });
        }
        
        function hideAll() {
            Array.from(activeCircuits).forEach(id => {
                toggleCircuit(id);
            });
        }
        
        function resetView() {
            AnatomicalCircuitRenderer.resetHighlight();
        }
        
        // Initialize when DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
